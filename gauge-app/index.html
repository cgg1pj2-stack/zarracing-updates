<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zar Racing">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23030507'/%3E%3Cpath d='M12 16h40L24 48h28' stroke='%231ea7ff' stroke-width='9' fill='none'/%3E%3C/svg%3E">
<title>Zar Racing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#030507">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800;1,900&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: neon bike dash - header + shift-light strip, then a glowing frame: tiles | carbon tach | tiles.
   One committed dark look; the accent (and its glow) is the rider's colour choice: --acc / --acc-rgb. */
:root {
  --bg: #030507;
  --tile: rgba(6, 9, 13, .86);
  --line: #23262e;
  --fg: #f2f5fa;
  --muted: #9aa3b2;
  --acc-rgb: 30, 167, 255;
  --acc: rgb(var(--acc-rgb));
  --glow: rgba(var(--acc-rgb), .55);
  --amber: #ffb020;
  --red: #ff2a2f;
  --green: #3fe06b;
  --f-num: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-ui: "Chakra Petch", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 14px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.app { position: relative; z-index: 1; display: grid; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* ---- header ---- */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { font-family: var(--f-num); font-style: italic; font-weight: 900; font-size: 34px; letter-spacing: .5px; line-height: 1; white-space: nowrap; }
.logo b { color: var(--acc); text-shadow: 0 0 14px var(--glow); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); background: rgba(10, 12, 16, .85);
  font-size: 13px; letter-spacing: .8px; text-transform: uppercase; border-radius: 4px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #555b66; }
.ok .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
.wait .dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.bad .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
.actions { display: flex; gap: 8px; }
.btn { border: 1.5px solid rgba(var(--acc-rgb), .9); background: rgba(6, 9, 13, .85); padding: 8px 16px; font-size: 15px; border-radius: 5px;
  box-shadow: 0 0 10px rgba(var(--acc-rgb), .35), inset 0 0 8px rgba(var(--acc-rgb), .12); }
.btn.on { background: rgba(var(--acc-rgb), .22); }
.btn.icon { padding: 8px 12px; }
.swatch-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 8px var(--glow); vertical-align: -2px; }

.swatches { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border: 1px solid rgba(var(--acc-rgb), .6);
  background: rgba(6, 9, 13, .92); border-radius: 6px; box-shadow: 0 0 14px rgba(var(--acc-rgb), .25); }
.swatches span { font-size: 13px; letter-spacing: 1px; color: var(--muted); margin-right: 4px; }
.spdset { flex-wrap: wrap; display: inline-flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: 13px; order: 9; }
.spdset b { color: #ffc400; font-family: var(--f-num); font-size: 22px; font-style: italic; min-width: 40px; text-align: center; }
.tach { cursor: pointer; }
.swl { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.logoset { flex-basis: 100%; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.logoset .lt { font-size: 13px; letter-spacing: 1px; color: var(--muted); }
#lgPrev { width: 160px; height: 120px; border: 1px solid rgba(var(--acc-rgb), .7); background: #000; image-rendering: pixelated; }
.lgc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.lgc label.btn { cursor: pointer; }
#lgMsg { font-size: 13px; color: var(--muted); }
#lgSend[disabled] { opacity: .45; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 14px currentColor; }

/* ---- tabs + shift light strip ---- */
.sub { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.tabs { display: flex; }
.tab { background: none; border: 0; padding: 6px 18px; font-family: var(--f-num); font-weight: 800; font-style: italic; font-size: 22px;
  letter-spacing: 1px; color: var(--muted); border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--acc); box-shadow: 0 6px 10px -8px var(--acc); }
.shift { flex: 1; min-width: 220px; display: flex; gap: 3px; padding: 6px 8px; background: rgba(4, 6, 9, .9); border: 1px solid var(--line); border-radius: 6px; }
.shift i { flex: 1; height: 16px; border-radius: 2px; background: #15171c; }
.shift i.on.w { background: #f4f6fb; box-shadow: 0 0 6px rgba(255, 255, 255, .8); }
.shift i.on.a { background: var(--amber); box-shadow: 0 0 7px var(--amber); }
.shift i.on.r { background: var(--red); box-shadow: 0 0 8px var(--red); }
.shift.flash i.on { background: var(--acc); box-shadow: 0 0 9px var(--acc); }

.note { margin: 0; padding: 10px 12px; border-left: 3px solid var(--amber); background: rgba(10, 12, 16, .92); font-size: 13px; color: var(--muted); }
.note strong { color: var(--fg); }

/* ---- gauge frame ---- */
.frame { border: 1px solid #2a2e37; border-radius: 8px; background: rgba(3, 5, 7, .55); padding: 10px; }
.dash { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(0, 2.1fr) minmax(150px, 1fr); gap: 12px; }
.col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.tile { background: var(--tile); border: 1.5px solid rgba(var(--acc-rgb), .85); padding: 9px 14px 10px; border-radius: 5px; min-width: 0;
  box-shadow: 0 0 12px rgba(var(--acc-rgb), .45), inset 0 0 14px rgba(var(--acc-rgb), .12); }
.lbl { font-size: 14px; letter-spacing: 1.4px; text-transform: uppercase; color: #dfe4ec; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.val { font-family: var(--f-num); font-weight: 900; font-style: italic; font-size: 46px; line-height: 1.02; font-variant-numeric: tabular-nums;
  color: var(--acc); text-shadow: 0 0 12px var(--glow); }
.meter { height: 7px; background: #13161c; margin-top: 6px; overflow: hidden; border-radius: 2px; }
.meter i { display: block; height: 100%; width: 0; background: var(--acc); box-shadow: 0 0 8px var(--acc); transition: width .12s linear; }
.warn .val { color: var(--amber); text-shadow: 0 0 12px rgba(255, 176, 32, .6); }
.crit .val { color: var(--red); text-shadow: 0 0 12px rgba(255, 42, 47, .7); }
.cold .val { color: #8fd3ff; }
.tile .mini { border: 1px solid #3a3f4a; background: transparent; padding: 1px 8px; font-size: 12px; border-radius: 3px; letter-spacing: 1px; }
.tach { position: relative; border: 1px solid #2a2e37; border-radius: 6px; min-width: 0; overflow: hidden;
  background:
    radial-gradient(circle at 50% 50%, rgba(3, 5, 7, 0) 30%, rgba(3, 5, 7, .85) 100%),
    repeating-linear-gradient(45deg, #0b0c0f 0 3px, #15171b 3px 6px),
    repeating-linear-gradient(-45deg, rgba(255, 255, 255, .025) 0 3px, transparent 3px 6px); }
.tach canvas { display: block; width: 100%; height: auto; aspect-ratio: 1.3 / 1; max-width: 100%; max-height: calc(100dvh - 150px); object-fit: contain; margin: 0 auto; }

/* ---- drag view ---- */
.gpsbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.gl { font-size: 13px; letter-spacing: 1.2px; color: var(--muted); }
.seg { display: inline-flex; border: 1.5px solid rgba(var(--acc-rgb), .8); border-radius: 5px; overflow: hidden; }
.sbtn { background: rgba(6, 9, 13, .85); border: 0; padding: 7px 14px; font-size: 14px; color: var(--muted); }
.sbtn[aria-pressed="true"] { background: rgba(var(--acc-rgb), .3); color: var(--fg); }
#bDist[disabled] { opacity: .45; cursor: default; }
.drag { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; }
.state { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
.state .big { font-family: var(--f-num); font-weight: 900; font-style: italic; font-size: 38px; letter-spacing: 1px; }
.state .sub2 { font-family: var(--f-num); font-weight: 600; font-size: 21px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows { margin-top: 10px; padding: 0; overflow: hidden; }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: baseline; padding: 6px 16px; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.row:nth-child(even) { background: rgba(255, 255, 255, .03); }
.row .n { font-weight: 800; font-size: 19px; }
.row .t { font-weight: 800; font-size: 21px; color: var(--acc); text-align: right; min-width: 72px; }
.row .s { font-weight: 600; font-size: 19px; color: var(--acc); text-align: right; min-width: 96px; }
.row.off .n, .row.off .t, .row.off .s { color: #3d424d; }
.row.best { background: linear-gradient(90deg, rgba(var(--acc-rgb), .55), rgba(var(--acc-rgb), .12)); }
.row.best .n, .row.best .t, .row.best .s { color: #fff; }
.row.best .t, .row.run .t { font-size: 30px; font-style: italic; text-shadow: 0 0 10px var(--glow); }
.row.run .t { color: var(--fg); }
.row.head .n { font-family: var(--f-ui); font-size: 13px; letter-spacing: 1.2px; color: var(--acc); font-weight: 700; }
.pos { color: var(--red) !important; } .neg { color: var(--green) !important; }
.hist h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 1.2px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hlist { display: grid; gap: 8px; max-height: 440px; overflow-y: auto; }
.h { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.h .d { font-size: 13px; color: var(--muted); font-family: var(--f-ui); }
.h .tm { font-size: 26px; font-weight: 800; font-style: italic; color: var(--acc); }
.h .tag { font-size: 12px; padding: 2px 6px; background: var(--acc); color: #000; font-family: var(--f-ui); font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1px dashed #333844; border-radius: 5px; background: rgba(6, 9, 13, .8); }

@media (max-width: 760px) {
  .dash { grid-template-columns: 1fr 1fr; }
  .tach { grid-column: 1 / -1; order: -1; }
  .drag { grid-template-columns: 1fr; }
  .logo { font-size: 28px; }
  .val { font-size: 38px; }
}
@media (max-height: 520px) and (orientation: landscape) {   /* phone on the handlebar */
  body { padding-block: 4px 6px; }
  .app { gap: 5px; }
  .bar { flex-wrap: nowrap; gap: 8px; }
  .logo { font-size: 24px; }
  .chip { padding: 3px 8px; font-size: 11px; gap: 5px; }
  .btn { padding: 5px 10px; font-size: 13px; }
  .tab { font-size: 17px; padding: 3px 12px; }
  .shift i { height: 11px; }
  .frame { padding: 6px; }
  .dash { gap: 7px; } .col { gap: 6px; } .tile { padding: 4px 10px 6px; }
  .lbl { font-size: 11px; }
  .val { font-size: 30px; }
  .tach canvas { max-height: calc(100dvh - 92px); }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>
</head>
<body>


<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="bar">
    <div class="logo"><b>ZAR</b> RACING</div>
    <div class="chips">
      <span class="chip bad" id="cBle"><span class="dot"></span><span>BT OFF</span></span>
      <span class="chip" id="cEcu"><span class="dot"></span><span>ECU</span></span>
      <span class="chip" id="cGps"><span class="dot"></span><span>GPS</span></span>
    </div>
    <div class="actions">
      <button class="btn" id="bConnect" type="button">เชื่อมต่อ</button>
      <button class="btn" id="bDemo" type="button">DEMO</button>
      <button class="btn icon" id="bColor" type="button" aria-label="สีและตั้งค่า" aria-expanded="false"><span class="swatch-dot"></span></button>
      <button class="btn icon" id="bFull" type="button" aria-label="Fullscreen">⛶</button>
    </div>
  </header>

  <div class="swatches" id="sw" hidden>
    <span>สีธีม</span>
    <span class="swl" id="swList"></span>
    <span class="spdset">ความเร็วจากกล่อง ECM (คำนวณจากรอบ)
      <button type="button" class="btn icon" id="bKm">−</button>
      <b id="kmVal">10.5</b> km/h ต่อ 1000 รอบ
      <button type="button" class="btn icon" id="bKp">+</button>
      <button type="button" class="btn" id="bCal" title="วิ่งนิ่งๆ เกียร์สูงสุด แล้วกด">ปรับเทียบกับ GPS</button>
      <span id="calMsg"></span>
    </span>
    <div class="logoset">
      <span class="lt">โลโก้หน้าเปิดเครื่อง</span>
      <canvas id="lgPrev" width="320" height="240" aria-label="ตัวอย่างโลโก้"></canvas>
      <div class="lgc">
        <label class="btn" for="lgFile">เลือกรูป</label>
        <input type="file" id="lgFile" accept="image/*" hidden>
        <div class="seg" role="group" aria-label="การวางรูป">
          <button type="button" class="sbtn" id="lgFit" aria-pressed="true">พอดีจอ</button>
          <button type="button" class="sbtn" id="lgFill" aria-pressed="false">เต็มจอ</button>
        </div>
        <button type="button" class="btn" id="lgSend" disabled>ส่งเข้าเกจ</button>
        <button type="button" class="btn" id="lgReset">คืนค่าโลโก้ ZAR</button>
        <span id="lgMsg">เลือกรูป แล้วกดส่ง (ต้องเชื่อมต่อเกจ)</span>
      </div>
    </div>
  </div>

  <div class="sub">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tGauge" aria-selected="true" type="button">GAUGE</button>
      <button class="tab" role="tab" id="tDrag" aria-selected="false" type="button">DRAG LOG</button>
    </div>
    <div class="shift" id="shift" aria-hidden="true"></div>
  </div>

  <p class="note" id="note" hidden></p>

  <section id="vGauge">
    <div class="frame dash">
      <div class="col">
        <div class="tile" id="kTps"><div class="lbl"><span>TPS</span><span>%</span></div><div class="val">--</div><div class="meter"><i></i></div></div>
        <div class="tile" id="kAfr"><div class="lbl"><span>AFR</span><span>O2</span></div><div class="val">--</div><div class="meter"><i></i></div></div>
        <div class="tile" id="kIgn"><div class="lbl"><span>IGN</span><span>°BTDC</span></div><div class="val">--</div></div>
      </div>
      <div class="tach"><canvas id="cv" width="820" height="630"></canvas></div>
      <div class="col">
        <div class="tile" id="kEct"><div class="lbl"><span>ECT</span><span>°C</span></div><div class="val">--</div></div>
        <div class="tile" id="kIat"><div class="lbl"><span>IAT</span><span>°C</span></div><div class="val">--</div></div>
        <div class="tile" id="kBat"><div class="lbl"><span>BATTERY</span><span>V</span></div><div class="val">--</div></div>
        <div class="tile" id="kTop"><div class="lbl"><span>TOP SPEED</span><span>KM/H</span></div><div class="val">--</div></div>
        <div class="tile" id="kPeak"><div class="lbl"><span>PEAK RPM</span><button class="mini" id="bResetPeak" type="button">RESET</button></div><div class="val">--</div></div>
      </div>
    </div>
  </section>

  <section id="vDrag" hidden>
    <div class="drag">
      <div>
        <div class="gpsbar">
          <span class="gl">GPS</span>
          <div class="seg" role="group" aria-label="GPS source">
            <button type="button" data-src="auto" class="sbtn">AUTO</button>
            <button type="button" data-src="phone" class="sbtn">มือถือ</button>
            <button type="button" data-src="gauge" class="sbtn">เกจ</button>
          </div>
          <button type="button" class="btn" id="bDist">ระยะ 402 M</button>
        </div>
        <div class="tile state"><span class="big" id="dState">NO GPS</span><span class="sub2" id="dLive"></span></div>
        <div class="tile rows" id="dRows"></div>
      </div>
      <div class="hist">
        <h3><span>ประวัติรอบวิ่ง (เก็บในมือถือนี้)</span><button class="btn" id="bClearHist" type="button" style="padding:3px 10px;font-size:12px">ล้าง</button></h3>
        <div class="hlist" id="hList"></div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const SVC  = '7a617200-6761-7567-6500-000000000000';
  const LIVE = '7a617200-6761-7567-6500-000000000001';
  const DRAG = '7a617200-6761-7567-6500-000000000002';
  const LOGO = '7a617200-6761-7567-6500-000000000003';
  const SPLITS = ['60 FT', '100 M', '201 M', '402 M', '1000 M'];
  const STATE = ['NO GPS', 'STOP TO ARM', 'READY', 'RUN'];
  const RPM_MAX = 15000;
  const $ = id => document.getElementById(id);

  // ---------- state ----------
  const S = { live: null, drag: null, link: 'off', demo: false, rpmShown: 0, top: 0, peak: 0, lastCounter: -1 };
  let chLogo = null, logoWait = null;
  let dev = null, chLive = null, chDrag = null, wake = null, reconnectTimer = 0;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let hist = store.get('zar.hist', []);

  // ---------- decode (matches src/data/ble_packet.h) ----------
  function decodeLive(dv) {
    const f0 = dv.getUint8(0), f1 = dv.getUint8(1);
    return {
      rpm: f0 & 1 ? dv.getUint16(2, true) : null,
      ect: f0 & 2 ? dv.getUint8(4) - 40 : null,
      iat: f0 & 4 ? dv.getUint8(5) - 40 : null,
      bat: f0 & 8 ? dv.getUint8(6) / 10 : null,
      tps: f0 & 16 ? dv.getUint8(7) : null,
      ign: f0 & 32 ? (dv.getUint8(8) - 128) / 2 : null,
      afr: f0 & 64 ? dv.getUint8(9) / 10 : null,
      shift: !!(f0 & 128),
      gps: !!(f1 & 1), fix: !!(f1 & 2), ecu: !!(f1 & 4), ecuSpd: f1 & 8 ? dv.getUint8(13) : null,
      kmh: dv.getUint16(10, true) / 10, sats: dv.getUint8(12), hz: dv.getUint8(14) >> 4,
      dst: dv.getUint8(14) & 15, el: dv.getUint16(15, true) / 100, dist: dv.getUint16(17, true),
      counter: dv.getUint8(19)
    };
  }

  // ---------- bluetooth ----------
  function note(html) { const n = $('note'); n.innerHTML = html; n.hidden = !html; }
  if (!navigator.bluetooth) {
    note('เบราว์เซอร์นี้ต่อบลูทูธกับเกจไม่ได้ (<strong>Android:</strong> ใช้ Chrome · <strong>iPhone:</strong> ใช้แอป Bluefy) แต่ <strong>DRAG LOG จับเวลาด้วย GPS มือถือ</strong> ได้เลย');
  }

  async function connect() {
    if (!navigator.bluetooth) return;
    try {
      setLink('wait', 'SCAN');
      dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }, { name: 'ZAR GAUGE' }], optionalServices: [SVC] });
      dev.addEventListener('gattserverdisconnected', onDisconnect);
      await openGatt();
    } catch (e) {
      setLink('off', 'BT OFF');
      if (e && e.name !== 'NotFoundError') note('เชื่อมต่อไม่ได้: ' + (e.message || e) + ' — เปิดบลูทูธและตำแหน่ง (Location) ของมือถือ แล้วลองใหม่');
    }
  }
  async function openGatt() {
    setLink('wait', 'CONNECTING');
    const gatt = await dev.gatt.connect();
    const svc = await gatt.getPrimaryService(SVC);

    bctx.fillStyle = '#030507'; bctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H * 0.55, maxR = Math.hypot(W, H) * 0.6;
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 260; i++) {
      const a = rnd() * Math.PI * 2;
      const r0 = maxR * (0.28 + rnd() * 0.55), len = maxR * (0.05 + rnd() * 0.25);
      const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0;

  const ledEls = [...shiftEl.children];

  // ---------- paint: tach (canvas) ----------

  function drawTach() {

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e6e9ef';

  // ---------- demo (no gauge needed) ----------
  let demoT = 0, demoTimer = 0, demoRun = { seq: 0 }, demoBest = null, demoCounter = 0;
  function demoTick() {
    demoT += 0.1;
    const cyc = demoT % 30;                         // 0-6 s stopped, 6-24 run, 24-30 coast
    let kmh = 0, rpm = 1500, dst = 2, el = 0, dist = 0;
    if (cyc >= 6 && cyc < 24) {
      const t = cyc - 6;
      kmh = 165 * (1 - Math.exp(-t / 7.5));
      rpm = 4500 + ((t * 2.9) % 3) / 3 * 7000;
      dst = 3; el = t; dist = 165 / 3.6 * (t - 7.5 * (1 - Math.exp(-t / 7.5)));

    } else if (cyc >= 24) { kmh = 165 * (1 - (cyc - 24) / 6); rpm = 3000 + kmh * 30; dst = 1; }
    if (cyc >= 6 && cyc < 6.15 && (!demoRun.seq || demoRun.done)) { demoRun = { seq: (demoRun.seq || 0) + 1, done: 0 }; }
    rpm += Math.sin(demoT * 9) * 120;
    const live = { rpm: Math.round(rpm), ect: 86, iat: 38, bat: 13.8, tps: dst === 3 ? 100 : 4, ign: 12 + rpm / 1200, afr: dst === 3 ? 12.9 : 14.6,

  function finishDemo() {
    const k = 0.94 + Math.random() * 0.1;                          // each run a bit different

    const dt = t => 165 * k / 3.6 * (t - 7.5 * (1 - Math.exp(-t / 7.5)));
    const tAt = D => { let a = 0, b = 60; for (let i = 0; i < 50; i++) { const m = (a + b) / 2; dt(m) < D ? a = m : b = m; } return a; };
    const t = [18.288, 100, 201.168, 402.336, -1].map(D => D < 0 ? -1 : +(tAt(D) + 0.3).toFixed(3));
    const v = t.map(x => x < 0 ? 0 : +vt(x - 0.3).toFixed(1));
    const run = { seq: demoRun.seq, done: 1, t, v, vmax: v[3] };
    const prev = demoBest;
    run.delta = prev ? +(t[3] - prev.t[3]).toFixed(3) : 0;

    demoRun = run;
    demoCounter++;
    onDrag({ tgt: 402.3, name: '402 M', st: 1, run, best: demoBest });
  }
  $('bDemo').addEventListener('click', () => {
    S.demo = !S.demo;
    $('bDemo').classList.toggle('on', S.demo);
    clearInterval(demoTimer);
    if (S.demo) {
      if (dev && dev.gatt.connected) dev.gatt.disconnect();
      setLink('wait', 'DEMO');
      stopPhoneGps();
      demoTimer = setInterval(demoTick, 100);
      if (!S.drag) onDrag({ tgt: 402.3, name: '402 M', st: 2, run: { seq: 0, done: 0, t: [-1, -1, -1, -1, -1], v: [0, 0, 0, 0, 0], vmax: 0 }, best: { seq: 0, done: 0, t: [-1, -1, -1, -1, -1], v: [0, 0, 0, 0, 0], vmax: 0 } });
      keepAwake();
    } else { setLink('off', 'BT OFF'); S.live = null; S.drag = null; syncGpsSource(); paintTiles(); paintDragLive(); }
  });

  // ---------- phone GPS + drag timer in the page (for gauges without a GPS module) ----------
  // Same method as the gauge (src/ui/gps_drag.cpp): distance = integral of the Doppler speed with
  // constant acceleration between fixes, split crossings solved inside each interval, launch time
  // extrapolated back to 0 km/h from the first two moving fixes.
  const SPLIT_M = [18.288, 100, 201.168, 402.336, 1000], TGT = [1, 2, 3, 4];
  class DragEngine {
    constructor(arm, launch, gapMs) { this.arm = arm; this.launchKmh = launch; this.gap = gapMs; this.target = 2; this.seq = 0;
      this.state = 0; this.have = false; this.best = [null, null, null, null]; this.last = null; this.run = null; this.delta = 0; this.newBest = false; }
    blank(seq) { return { seq, done: 0, t: [-1, -1, -1, -1, -1], v: [0, 0, 0, 0, 0], vmax: 0 }; }
    begin(t0) { this.run = this.blank(this.seq); this.t0 = t0; this.t = t0; this.v = 0; this.d = 0; this.state = 3; }
    step(t1, v1) {
      const dt = (t1 - this.t) / 1000; if (dt <= 0) return false;
      const u0 = this.v / 3.6, u1 = v1 / 3.6, a = (u1 - u0) / dt, d1 = this.d + (u0 + u1) / 2 * dt;
      let split = false;
      for (let k = 0; k <= TGT[this.target]; k++) {
        if (this.run.t[k] >= 0) continue;
        const D = SPLIT_M[k]; if (D > d1) break;
        const rem = D - this.d; let tau;
        if (Math.abs(a) < 1e-6) tau = u0 > 1e-6 ? rem / u0 : dt;
        else { const disc = u0 * u0 + 2 * a * rem; tau = disc < 0 ? dt : (-u0 + Math.sqrt(disc)) / a; }
        tau = Math.max(0, Math.min(dt, tau));
        this.run.t[k] = (this.t - this.t0) / 1000 + tau; this.run.v[k] = (u0 + a * tau) * 3.6; split = true;
      }
      if (v1 > this.run.vmax) this.run.vmax = v1;
      this.t = t1; this.v = v1; this.d = d1;
      return split;
    }
    lost() { const was = this.state === 3; this.state = 0; this.have = false; if (was) this.seq--; return was ? 'abort' : ''; }
    setTarget(i) { if (this.state === 3) { this.state = 1; this.seq--; } this.target = i; this.last = null; this.delta = 0; }
    feed(valid, t, kmh) {
      if (!valid) return this.lost();
      kmh = Math.max(0, kmh);
      if (this.have) {
        const dt = t - this.t;
        if (dt <= 0) return '';
        if (dt > this.gap) { this.have = false; if (this.state === 3) { this.state = 1; this.seq--; return 'abort'; } }
      }
      if (!this.have) { this.have = true; this.t = t; this.v = kmh; if (this.state === 0 || this.state === 3) this.state = kmh < this.arm ? 2 : 1; if (this.state === 2) this.zt = t; return ''; }
      if (this.state === 0 || this.state === 1) { this.t = t; this.v = kmh; if (kmh < this.arm) { this.state = 2; this.zt = t; return 'ready'; } return ''; }
      if (this.state === 2) {
        if (kmh < this.launchKmh) { this.t = t; this.v = kmh; if (kmh < 1) this.zt = t; return ''; }
        const dt = t - this.t, a = (kmh - this.v) / dt;
        let t0 = a > 0 ? t - kmh / a : this.t; t0 = Math.max(this.t - dt, Math.min(t, t0));
        this.seq++; this.lt = t; this.lv = kmh; this.lstop = Math.min(this.zt ?? this.t, this.t); this.refine = true;
        this.begin(t0); this.step(t, kmh);
        return this.finished() ? this.finish() : 'start';
      }
      // running
      if (kmh < this.arm) { this.t = t; this.v = kmh; this.zt = t; this.state = 2; this.seq--; return 'abort'; }
      if (this.refine) {
        this.refine = false;
        const a = (kmh - this.lv) / (t - this.lt);
        if (a > 0) { let t0 = this.lt - this.lv / a; t0 = Math.max(this.lstop - 100, Math.min(this.lt, t0)); this.begin(t0); this.step(this.lt, this.lv); }
      }
      this.step(t, kmh);
      return this.finished() ? this.finish() : '';
    }
    finished() { return this.run.t[TGT[this.target]] >= 0; }
    finish() {
      this.run.done = 1;
      const b = this.best[this.target], tot = this.run.t[TGT[this.target]];
      this.delta = b ? tot - b.t[TGT[this.target]] : 0; this.run.delta = this.delta;
      this.newBest = !b || tot < b.t[TGT[this.target]];
      if (this.newBest) this.best[this.target] = this.run;
      this.last = this.run; this.state = 1;
      return 'finish';
    }
    view() {
      const empty = this.blank(0);
      return { tgt: SPLIT_M[TGT[this.target]], name: SPLITS[TGT[this.target]], st: this.state,
               run: this.state === 3 ? this.run : (this.last || empty), best: this.best[this.target] || empty };
    }
  }
  const pdrag = new DragEngine(3, 6, 3500);          // phone fixes are ~1 Hz and noisier at rest
  pdrag.target = store.get('zar.ptarget', 2);
  S.gpsSrc = store.get('zar.gpssrc', 'auto');
  S.phone = { on: false, fix: false, kmh: 0, acc: 0, hz: 0, err: '' };
  let watchId = null, lastFix = null, fixTimes = [];

  function usePhone() {
    if (S.gpsSrc === 'phone') return true;
    if (S.gpsSrc === 'gauge') return false;
    return !(S.live && S.live.gps);                  // AUTO: the gauge's GPS when it has one
  }
  function hav(a, b) {
    const R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function startPhoneGps() {
    if (watchId != null || !navigator.geolocation) { if (!navigator.geolocation) S.phone.err = 'NO GPS API'; return; }
    S.phone.on = true;
    watchId = navigator.geolocation.watchPosition(onFix, e => {
      S.phone.err = e.code === 1 ? 'ไม่ได้อนุญาต' : 'NO FIX';
      S.phone.fix = false; paintTiles(); paintDragLive();
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
  }
  function stopPhoneGps() {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null; S.phone.on = false; S.phone.fix = false; lastFix = null;
  }
  function onFix(p) {
    const c = p.coords, t = p.timestamp;
    const cur = { lat: c.latitude, lon: c.longitude, t };
    let kmh = c.speed != null && c.speed >= 0 ? c.speed * 3.6 : null;
    if (kmh == null && lastFix && t > lastFix.t) kmh = hav(lastFix, cur) / ((t - lastFix.t) / 1000) * 3.6;   // no Doppler speed: from position
    lastFix = cur;
    fixTimes.push(t); fixTimes = fixTimes.filter(x => t - x < 5000);
    const good = c.accuracy < 30 && kmh != null;
    S.phone = { on: true, fix: good, kmh: kmh || 0, acc: c.accuracy, hz: fixTimes.length > 1 ? (fixTimes.length - 1) / ((fixTimes[fixTimes.length - 1] - fixTimes[0]) / 1000) : 0, err: '' };
    if (S.phone.kmh > S.top && good) S.top = S.phone.kmh;
    if (usePhone()) {
      const ev = pdrag.feed(good, t, S.phone.kmh);
      if (ev === 'finish' || ev === 'start' || ev === 'abort' || ev === 'ready') { onDrag(pdrag.view()); beep(ev); }
      else if (pdrag.state === 3) paintDrag();
    }
    paintTiles(); paintDragLive();
  }
  let actx = null;
  function beep(ev) {
    if (ev !== 'finish' && ev !== 'start') return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = ev === 'finish' ? (pdrag.newBest ? 2600 : 1800) : 1400;
      g.gain.value = 0.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ev === 'finish' ? 0.35 : 0.12));
    } catch (e) {}
  }
  function syncGpsSource() {
    document.querySelectorAll('.sbtn[data-src]').forEach(b => b.setAttribute('aria-pressed', b.dataset.src === S.gpsSrc));
    const phone = usePhone();
    if (phone && !S.demo) startPhoneGps(); else if (!phone) stopPhoneGps();
    $('bDist').disabled = !phone;
    $('bDist').textContent = 'ระยะ ' + SPLITS[TGT[pdrag.target]];
    if (phone && !S.demo) onDrag(pdrag.view());
    paintTiles(); paintDragLive();
  }
  document.querySelectorAll('.sbtn[data-src]').forEach(b => b.addEventListener('click', () => {
    S.gpsSrc = b.dataset.src; store.set('zar.gpssrc', S.gpsSrc); syncGpsSource();
    if (!usePhone()) readDrag();
  }));
  $('bDist').addEventListener('click', () => {
    pdrag.setTarget((pdrag.target + 1) % 4); store.set('zar.ptarget', pdrag.target);
    syncGpsSource();
  });

  // tap the dial: speed from GPS <-> from rpm
  $('cv').addEventListener('click', () => { S.spdSrc = S.spdSrc === 'gps' ? 'ecm' : 'gps'; store.set('zar.spdsrc', S.spdSrc); });
  // CAL: make the rpm speed equal the GPS right now (ride steady in top gear)
  $('bCal').addEventListener('click', () => {
    const g = gpsNow(), d = S.live || {};
    if (!g.fix || g.kmh < 20 || d.rpm == null || d.rpm < 1500) { $('calMsg').textContent = 'ต้องมี GPS, วิ่ง > 20 km/h และเครื่องติด'; return; }
    setKm(g.kmh / (d.rpm / 1000));
    $('calMsg').textContent = 'ปรับเทียบแล้ว ✓';
  });
  function setKm(v) { S.kmhPerK = Math.round(Math.max(3, Math.min(25, v)) * 10) / 10; store.set('zar.kmhk', S.kmhPerK); $('kmVal').textContent = S.kmhPerK.toFixed(1); }
  $('bKm').addEventListener('click', () => setKm(S.kmhPerK - 0.1));
  $('bKp').addEventListener('click', () => setKm(S.kmhPerK + 0.1));
  setKm(S.kmhPerK);

  // ---------- custom boot logo -> gauge (format: src/data/logo_codec.h) ----------
  const LW = 320, LH = 240;
  const lgPrev = $('lgPrev'), lgCtx = lgPrev.getContext('2d');
  let lgImg = null, lgFill = false, lgBusy = false;
  function lgMsg(t) { $('lgMsg').textContent = t; }
  function lgDraw() {
    lgCtx.fillStyle = '#000'; lgCtx.fillRect(0, 0, LW, LH);
    if (!lgImg) return;
    const s = lgFill ? Math.max(LW / lgImg.width, LH / lgImg.height) : Math.min(LW / lgImg.width, LH / lgImg.height);
    const w = lgImg.width * s, h = lgImg.height * s;
    lgCtx.imageSmoothingQuality = 'high';
    lgCtx.drawImage(lgImg, (LW - w) / 2, (LH - h) / 2, w, h);
  }
  $('lgFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => { lgImg = im; lgDraw(); $('lgSend').disabled = false; lgMsg('พร้อมส่ง ' + LW + '×' + LH); };
    im.onerror = () => lgMsg('เปิดรูปนี้ไม่ได้');
    im.src = url;
  });
  function lgMode(fill) { lgFill = fill; $('lgFit').setAttribute('aria-pressed', !fill); $('lgFill').setAttribute('aria-pressed', fill); lgDraw(); }
  $('lgFit').addEventListener('click', () => lgMode(false));
  $('lgFill').addEventListener('click', () => lgMode(true));
  lgDraw();

  function crc32(bytes) {
    let c = ~0 >>> 0;
    for (let i = 0; i < bytes.length; i++) { c ^= bytes[i]; for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1)); }
    return (~c) >>> 0;
  }
  function rle(px) {                                 // same packets as logoRleEncode()
    const out = []; let i = 0; const n = px.length;
    while (i < n) {
      let r = 1; while (i + r < n && r < 128 && px[i + r] === px[i]) r++;
      if (r >= 3) { out.push(0x80 | (r - 1), px[i] & 255, px[i] >> 8); i += r; continue; }
      let l = 0;
      while (i + l < n && l < 128 && !(i + l + 2 < n && px[i + l] === px[i + l + 1] && px[i + l] === px[i + l + 2])) l++;
      out.push(l - 1); for (let k = 0; k < l; k++) out.push(px[i + k] & 255, px[i + k] >> 8);
      i += l;
    }
    return Uint8Array.from(out);
  }
  function u32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  async function logoCmd(bytes, timeoutMs = 4000) {
    const got = new Promise((res, rej) => { logoWait = res; setTimeout(() => { if (logoWait === res) { logoWait = null; rej(new Error('timeout')); } }, timeoutMs); });
    await chLogo.writeValueWithResponse(Uint8Array.from(bytes));
    const r = await got;
    return { st: r[0], v: r[1] | r[2] << 8 | r[3] << 16 | r[4] << 24 };
  }
  const LS = { READY: 1, OK: 2, DONE: 3, DELETED: 4 };
  function needGauge() {
    if (S.link !== 'ok' || !chLogo) { lgMsg(S.link !== 'ok' ? 'ต้องเชื่อมต่อเกจก่อน' : 'เกจยังเป็นเฟิร์มแวร์เก่า: อัปเฟิร์มแวร์ใหม่ก่อน'); return false; }
    return true;
  }
  $('lgSend').addEventListener('click', async () => {
    if (lgBusy || !lgImg || !needGauge()) return;
    lgBusy = true; $('lgSend').disabled = true;
    try {
      const d = lgCtx.getImageData(0, 0, LW, LH).data;
      const px = new Uint16Array(LW * LH), raw = new Uint8Array(LW * LH * 2);
      for (let i = 0; i < LW * LH; i++) {
        const v = ((d[i * 4] & 0xF8) << 8) | ((d[i * 4 + 1] & 0xFC) << 3) | (d[i * 4 + 2] >> 3);
        px[i] = v; raw[i * 2] = v & 255; raw[i * 2 + 1] = v >> 8;
      }
      const data = rle(px), crc = crc32(raw);
      lgMsg('กำลังเตรียมหน่วยความจำ...');
      let r = await logoCmd([66, ...u32(LW * LH * 2)], 10000);                 // 'B'
      if (r.st !== LS.READY) throw new Error('เกจไม่พร้อม (' + r.st + ')');
      const CH = 160;
      for (let o = 0; o < data.length; o += CH) {
        const part = data.subarray(o, Math.min(data.length, o + CH));
        r = await logoCmd([68, ...u32(o), ...part]);                           // 'D'
        if (r.st !== LS.OK) throw new Error('ส่งข้อมูลผิดพลาด (' + r.st + ')');
        lgMsg('กำลังส่ง ' + Math.round((o + part.length) / data.length * 100) + '%');
      }
      r = await logoCmd([69, ...u32(crc)], 8000);                              // 'E'
      if (r.st !== LS.DONE) throw new Error('ตรวจข้อมูลไม่ผ่าน (' + r.st + ')');
      lgMsg('เสร็จแล้ว ✓ ปิด-เปิดกุญแจเพื่อดูโลโก้ใหม่');
    } catch (e) { lgMsg('ส่งไม่สำเร็จ: ' + (e.message || e)); }
    lgBusy = false; $('lgSend').disabled = !lgImg;
  });
  let lgArm = false;
  $('lgReset').addEventListener('click', async () => {
    if (lgBusy || !needGauge()) return;
    if (!lgArm) { lgArm = true; $('lgReset').textContent = 'แตะอีกครั้งเพื่อยืนยัน'; setTimeout(() => { lgArm = false; $('lgReset').textContent = 'คืนค่าโลโก้ ZAR'; }, 3000); return; }
    lgArm = false; $('lgReset').textContent = 'คืนค่าโลโก้ ZAR';
    try { const r = await logoCmd([88]); lgMsg(r.st === LS.DELETED ? 'คืนค่าแล้ว ✓ เปิดเครื่องครั้งหน้าเป็นโลโก้ ZAR' : 'ไม่สำเร็จ (' + r.st + ')'); }
    catch (e) { lgMsg('ไม่สำเร็จ: ' + (e.message || e)); }
  });

  // ---------- ui ----------
  $('bConnect').addEventListener('click', () => { if (S.link !== 'ok') { if (S.demo) $('bDemo').click(); connect(); } });
  $('bFull').addEventListener('click', async () => {
    try { if (!document.fullscreenElement) { await document.documentElement.requestFullscreen(); try { await screen.orientation.lock('landscape'); } catch (e) {} } else await document.exitFullscreen(); } catch (e) {}
  });
  function show(tab) {
    const g = tab === 'gauge';
    $('vGauge').hidden = !g; $('vDrag').hidden = g;
    $('tGauge').setAttribute('aria-selected', g); $('tDrag').setAttribute('aria-selected', !g);
    store.set('zar.tab', tab);
  }
  $('tGauge').addEventListener('click', () => show('gauge'));
  $('tDrag').addEventListener('click', () => show('drag'));
  show(store.get('zar.tab', 'gauge'));

  setTheme(store.get('zar.theme', 0));
  syncGpsSource();
  (function loop() { drawTach(); requestAnimationFrame(loop); })();
  paintTiles(); paintDrag(); paintDragLive();
  // first view: run the demo so the page shows what it does; Connect switches to the real gauge
  if (window.self !== window.top) $('bDemo').click();      // preview inside another page (no Bluetooth / GPS there)
})();
</script>
